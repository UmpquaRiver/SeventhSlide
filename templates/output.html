<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{title}</title>
  <style id="bundled-fonts">{bundled_fonts_css}</style>
  <style>
    html,body{{height:100%;margin:0;background:{bg};color:{fg};}}
    /* The window viewport clips the stage; the stage is a fixed-resolution canvas
       centred (flexbox) and uniformly scaled (see fitCanvas) to fit whatever
       display it lands on. Matching aspect ratios fill edge-to-edge; mismatched
       ones keep the design proportions and letterbox/pillarbox against the page
       background rather than distorting the content. */
    html,body{{overflow:hidden;}}
    body{{display:flex;align-items:center;justify-content:center;}}
    .canvas{{position:relative;flex:none;width:{canvas_w}px;height:{canvas_h}px;overflow:hidden;
      transform:scale(var(--fit-scale,1));transform-origin:center center;}}
    .bg-layer{{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;}}

    /* === Animated background (HTML5/CSS lower-third bar, etc.) ===
       A full-canvas, click-through layer above the screen background (bg-a/bg-b top
       out at z-index 1; this comes last in the DOM so it paints over the active one)
       and below the text (z-index 2). The bar anchors to the bottom and slides/fades
       as a unit; the lyric/Bible boxes get a matching rise so text settles with it.
       All show/hide is the single `.bar-shown` class on the canvas — one state
       toggle drives the whole in/out choreography. Colour shades, height and timing
       are CSS vars set by the controller, so presets stay look-only. */
    .anim-bg{{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;}}
    .anim-bar{{position:absolute;left:0;right:0;bottom:0;height:var(--bar-height,220px);
      opacity:0;transform:translateY(100%);will-change:transform,opacity;
      transition:transform var(--bar-dur,600ms) cubic-bezier(.22,.61,.36,1),
                 opacity var(--bar-dur,600ms) ease;}}
    .canvas.bar-shown .anim-bar{{opacity:var(--bar-opacity,1);transform:translateY(0);}}

    /* Preset: Song Bar — an understated broadcast lower-third. A soft vertical sheen
       on the bar colour, a hairline accent that wipes in along the top edge, and a
       lift shadow so it reads cleanly above live video. */
    .anim-bar.preset-song_bar{{
      background:linear-gradient(180deg,
        var(--bar-top,#24384a) 0%, var(--bar-mid,#1d2d3c) 55%, var(--bar-bottom,#16222e) 100%);
      box-shadow:0 -10px 30px rgba(0,0,0,.34);}}
    .anim-bar.preset-song_bar::before{{content:"";position:absolute;left:0;top:0;
      width:100%;height:3px;background:var(--bar-accent,#c9a86a);opacity:.92;
      transform:scaleX(0);transform-origin:left center;
      transition:transform calc(var(--bar-dur,600ms) * 1.15) cubic-bezier(.22,.61,.36,1) 90ms;}}
    .canvas.bar-shown .anim-bar.preset-song_bar::before{{transform:scaleX(1);}}

    /* Preset: Floating Bar — a modern, elevated lower-third card. Filled with the
       sheet-music texture (tinted navy for legibility), it floats clear of the bottom
       edge with rounded corners and a soft drop shadow, then eases up into place. */
    .anim-bar.preset-floating_bar{{
      left:var(--bar-inset,40px); right:var(--bar-inset,40px); bottom:var(--bar-gap,48px);
      border-radius:var(--bar-radius,16px); overflow:hidden;
      background-image:linear-gradient(180deg, rgba(var(--bar-tint-rgb,29,45,60),.12) 0%,
                                                rgba(var(--bar-tint-rgb,29,45,60),.46) 100%),
                       url('/assets/song-bar-texture.jpg');
      background-size:cover, cover; background-position:center, center; background-repeat:no-repeat, no-repeat;
      box-shadow:0 18px 50px rgba(0,0,0,.45);
      transform:translateY(calc(100% + var(--bar-gap,48px))) scale(.985);}}
    .canvas.bar-shown .anim-bar.preset-floating_bar{{transform:translateY(0) scale(1);}}
    /* Inner top highlight for a subtle lift, and the accent hairline that wipes in. */
    .anim-bar.preset-floating_bar::after{{content:"";position:absolute;inset:0;border-radius:inherit;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06);pointer-events:none;}}
    .anim-bar.preset-floating_bar::before{{content:"";position:absolute;left:0;right:0;top:0;height:2px;
      background:var(--bar-accent,#c9a86a);opacity:.85;transform:scaleX(0);transform-origin:center;
      transition:transform calc(var(--bar-dur,600ms) * 1.1) cubic-bezier(.22,.61,.36,1) 120ms;}}
    .canvas.bar-shown .anim-bar.preset-floating_bar::before{{transform:scaleX(1);}}

    /* In animated-bg mode the lyric/Bible box appears/disappears AS A UNIT with the
       bar. Its resting states are held by CSS, keyed on the same `.bar-shown` class
       that drives the bar: hidden (raised + transparent) when the bar is down, shown
       (in place, at the configured opacity) when it's up. The rise/fall itself is a
       transient — updateAnimPresentation runs an explicit Web Animations fade+rise
       only when the bar's shown state changes (a CSS transition can't be relied on
       for the entrance: the box is often revealed from display:none). Because the
       shown state is CSS-held, moving between slides while the bar stays up needs NO
       surface animation — the box simply stays shown and the inner #text/#text-alt
       buffers own the line-to-line cross-fade (the text theme's transition). */
    .canvas.anim-bg-mode .box,
    .canvas.anim-bg-mode .bible-box{{ opacity:0; transform:translateY(22px); }}
    .canvas.anim-bg-mode.bar-shown .box{{ opacity:var(--text-opacity,1); transform:translateY(0); }}
    .canvas.anim-bg-mode.bar-shown .bible-box{{ opacity:var(--bible-text-opacity,1); transform:translateY(0); }}
    /* An announcement/title overlay over the bar has no hidden baseline (its resting
       state stays visible), so returning to a title slide can't leave it stuck blank.
       On a bar entrance the rise plays over it; between slides it uses the text-theme
       fade (applyOverlay), never the rise. */

    /* Song/Lyrics Text Box */
    .box{{position:absolute;z-index:2;left:{box_x}px;top:{box_y}px;width:{box_w}px;height:{box_h}px;box-sizing:border-box;padding:{pad}px;display:grid;align-items:{valign_css};overflow:hidden;opacity:{text_opacity};}}
    .text{{font-family:"{font_family}";font-size:{font_size}px;font-weight:{text_weight};font-style:{text_style};color:{fg};text-align:{align};line-height:1.2;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;grid-area:1/1;width:100%;}}
    .text-alt{{font-family:"{font_family}";font-size:{font_size}px;font-weight:{text_weight};font-style:{text_style};color:{fg};text-align:{align};line-height:1.2;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;grid-area:1/1;width:100%;opacity:0;}}

    /* Chord-over-lyric rendering (generated by _ChordProcessor in lyrics.py).
       Each syllable is an inline-flex column: chord on top, lyric below. */
    .cc{{display:inline-flex;flex-direction:column;align-items:flex-start;vertical-align:bottom;}}
    /* Default (overlap, mirrors OpenLP): the chord has zero width and overflows to the
       right above its syllable, so the lyric keeps its natural spacing — no gaps. It still
       occupies the row vertically, so chord lines reserve height and wrap cleanly. */
    .cc>.ch{{font-size:0.75em;line-height:1.25;font-weight:600;color:#ffd400;white-space:pre;width:0;overflow:visible;}}
    .cc>.ly{{line-height:1.2;white-space:pre;}}
    /* Expand: a chord wider than its syllable reclaims its own width (so it can't collide
       with the next chord) plus a small trailing gap, and the lyric row stretches to that
       width so the connector can bridge the surplus. */
    .cc.cc-x>.ch{{width:auto;padding-right:0.3em;}}
    .cc.cc-x>.ly{{display:flex;align-items:baseline;align-self:stretch;}}
    /* Dashed connector: zero intrinsic width, grows into a wide chord's surplus and paints
       a single centered dash there (e.g. "A — men"). */
    .cc.cc-x>.ly>.fl{{flex:1 1 0;min-width:0;align-self:stretch;background-image:linear-gradient(currentColor,currentColor);background-size:42% 0.07em;background-position:center 60%;background-repeat:no-repeat;}}

    /* Bible Text Box (separate from lyrics) */
    .bible-box{{position:absolute;z-index:2;left:{bible_text_box_x}px;top:{bible_text_box_y}px;width:{bible_text_box_w}px;height:{bible_text_box_h}px;box-sizing:border-box;padding:{bible_text_pad}px;display:none;align-items:{bible_text_valign_css};overflow:hidden;opacity:{bible_text_opacity};}}
    .bible-text{{font-family:"{bible_main_font_family}";font-size:{bible_main_font_size}px;font-weight:{bible_text_weight};font-style:{bible_text_style};color:{bible_text_color};text-align:{bible_text_align};line-height:1.2;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;grid-area:1/1;width:100%;}}
    .bible-text-alt{{font-family:"{bible_main_font_family}";font-size:{bible_main_font_size}px;font-weight:{bible_text_weight};font-style:{bible_text_style};color:{bible_text_color};text-align:{bible_text_align};line-height:1.2;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;grid-area:1/1;width:100%;opacity:0;}}
    .verse-num {{ font-size: 0.5em; vertical-align: super; margin-right: 0.4em; }}

    /* Bible Reference Box */
    .bible-ref{{position:absolute;z-index:2;left:{bible_ref_x}px;top:{bible_ref_y}px;width:{bible_ref_w}px;height:{bible_ref_h}px;box-sizing:border-box;display:none;align-items:{bible_ref_valign_css};justify-content:{bible_ref_justify};font-family:"{bible_ref_font_family}";font-size:{bible_ref_font_size}px;font-weight:{bible_ref_weight};font-style:{bible_ref_style};color:{bible_ref_color};white-space:pre-wrap;opacity:{bible_ref_opacity};}}

    /* Copyright Info Box */
    .copyright-box{{position:absolute;z-index:2;left:{copyright_x}px;top:{copyright_y}px;width:{copyright_w}px;height:{copyright_h}px;box-sizing:border-box;display:none;align-items:{copyright_valign_css};font-family:"{copyright_font_family}";font-size:{copyright_font_size}px;font-weight:{copyright_weight};font-style:{copyright_style};color:{copyright_color};white-space:pre-wrap;text-align:{copyright_align};opacity:{copyright_opacity};}}

    /* Indicator */
    .indicator{{position:absolute;z-index:2;left:{ind_x}px;top:{ind_y}px;font-family:"{font_family}";font-size:{ind_fs}px;color:{ind_color};white-space:nowrap;opacity:{ind_opacity};}}

    /* Wall clock — themed overlay (background theme), sits above all content (incl.
       video/image) and is never hidden by a mode class. Its font defaults to the main
       text font (baked in below) but can be overridden per background theme. */
    .clock{{position:absolute;z-index:5;left:{clock_x}px;top:{clock_y}px;font-family:"{clock_font_family}";font-size:{clock_fs}px;color:{clock_color};white-space:nowrap;opacity:{clock_opacity};}}

    /* Video countdown */
    #video-countdown{{position:absolute;z-index:4;left:{countdown_x}px;top:{countdown_y}px;font-family:"{countdown_font_family}";font-size:{countdown_fs}px;font-weight:{countdown_weight};font-style:{countdown_style};color:{countdown_color};white-space:nowrap;text-align:{countdown_align};opacity:0;}}
    .canvas.video-mode #video-countdown{{opacity:{countdown_opacity};}}
    .ind-item{{display:inline-block; margin-right:8px; opacity:0.5;}}
    .ind-item.active{{opacity:1; font-weight:bold; color:white;}}
    
    /* Mode Classes */
    .canvas.song-mode .box {{ display: grid; }}
    .canvas.song-mode .bible-box {{ display: none; }}
    .canvas.song-mode .bible-ref {{ display: none; }}
    .canvas.song-mode .copyright-box {{ display: grid; }}

    .canvas.bible-mode .box {{ display: none; }}
    .canvas.bible-mode .bible-box {{ display: grid; }}
    .canvas.bible-mode .bible-ref {{ display: flex; }}
    .canvas.bible-mode .copyright-box {{ display: none; }}
    .canvas.bible-mode .indicator {{ display: none !important; }}

    .canvas.service-mode .copyright-box {{ display: grid; }}

    /* Video mode */
    #video-el {{ position:absolute; left:{video_x}px; top:{video_y}px; width:{video_w}px; height:{video_h}px; object-fit:contain; z-index:3; display:none; background:#000; }}
    .canvas.video-mode #video-el {{ display:block; }}
    .canvas.video-mode .box {{ display:none; }}
    .canvas.video-mode .bible-box {{ display:none; }}
    .canvas.video-mode .bible-ref {{ display:none; }}
    .canvas.video-mode .copyright-box {{ display:none; }}
    .canvas.video-mode .indicator {{ display:none !important; }}

    /* Image mode */
    #image-el {{ position:absolute; left:{image_x}px; top:{image_y}px; width:{image_w}px; height:{image_h}px; object-fit:{image_fit}; z-index:3; display:none; }}
    .canvas.image-mode #image-el {{ display:block; }}
    .canvas.image-mode .box {{ display:none; }}
    .canvas.image-mode .bible-box {{ display:none; }}
    .canvas.image-mode .bible-ref {{ display:none; }}
    .canvas.image-mode .copyright-box {{ display:none; }}
    .canvas.image-mode .indicator {{ display:none !important; }}

    /* Full-canvas overlay mode: the current slide carries a designed composition
       (announcement template today, song title slide later) that replaces the
       regular text surfaces while it is up. */
    #overlay-layer {{ position:absolute; inset:0; z-index:4; display:none; }}
    .canvas.overlay-mode #overlay-layer {{ display:block; }}
    .canvas.overlay-mode .box {{ display:none; }}
    .canvas.overlay-mode .bible-box {{ display:none; }}
    .canvas.overlay-mode .bible-ref {{ display:none; }}
    /* The copyright box is deliberately NOT hidden in overlay-mode: a song's title
       slide is an overlay, and copyright (per its own slide-position setting) belongs
       there. The server sends an empty string when the setting says otherwise, which
       renders nothing. It sits at z-index 2, beneath the transparent overlay layer. */
    .canvas.overlay-mode .indicator {{ display:none !important; }}
  </style>
</head>
<body>
  <div id="canvas" class="canvas song-mode">
    <!-- Double-buffered background layers: prevents flash during image transitions -->
    <div id="bg-a" class="bg-layer" style="z-index:1;{initial_bg_a}"></div>
    <div id="bg-b" class="bg-layer" style="z-index:0;"></div>

    <!-- Animated background layer (CSS lower-third bar; mounted on demand). Last of
         the background siblings so it paints above whichever bg layer is active. -->
    <div id="anim-bg" class="anim-bg"></div>

    <!-- Song/Lyrics Text Box -->
    <div class="box">
      <div id="text" class="text">{initial}</div>
      <div id="text-alt" class="text-alt"></div>
    </div>

    <!-- Bible Text Box (separate) -->
    <div class="bible-box">
      <div id="bible-text" class="bible-text"></div>
      <div id="bible-text-alt" class="bible-text-alt"></div>
    </div>

    <!-- Bible Reference Box -->
    <div id="bible-ref" class="bible-ref"></div>

    <!-- Copyright Info Box -->
    <div id="copyright-box" class="copyright-box"></div>

    <!-- Indicator -->
    <div id="indicator" class="indicator"></div>

    <!-- Wall clock (ticks client-side; shows the output device's local time) -->
    <div id="clock" class="clock"></div>

    <!-- Video countdown timer (shown only in video-mode when enabled) -->
    <div id="video-countdown"></div>

    <!-- Video element (shown only in video-mode) -->
    <video id="video-el" preload="auto"></video>

    <!-- Image element (shown only in image-mode) -->
    <img id="image-el" />

    <!-- Per-slide full-canvas overlay layer (shown only in overlay-mode) -->
    <div id="overlay-layer"></div>
  </div>
<script>
// Fade transition configuration
let ENABLE_FADE = {enable_fade};
let FADE_DURATION = {fade_duration};
let VIDEO_ENABLED = {video_enabled};
let IMAGE_ENABLED = {image_enabled};
// Wall-clock ticker state. Flags seeded from config; refreshed via applyStyle.
let CLOCK_ON = {clock_on};
let CLOCK_SECONDS = {clock_seconds};
let CLOCK_24H = {clock_24h};
let clockInterval = null;
// Tracks whether this output is currently blanked, so the client-side clock can be
// hidden along with the (server-cleared) slide/indicator/copyright content.
let IS_BLANK = false;
// Whether this output displays Bible text at all (the per-output "show Bible text"
// toggle). The server still sends verse HTML when it's off, so the animated bar gates
// on this to avoid showing over a hidden Bible box. Refreshed via applyStyle.
let SHOW_BIBLE_TEXT = true;
const IS_PREVIEW = new URLSearchParams(window.location.search).has('preview');
if (IS_PREVIEW) {{ document.getElementById('video-el').muted = true; }}
// Export harness mode: the server loads this page in headless Chromium to rasterize
// each slide (see _render_export_zip in lyrics.py). It never connects the live
// WebSocket; frames are pushed one at a time via window.__ssApplyExportFrame.
const IS_EXPORT = new URLSearchParams(window.location.search).has('export');
let previewVideoMode = 'still';
let holdFrame = false;
let songContainerIndex = 0;
let bibleContainerIndex = 0;
let lastSlideHtml = '';
let lastTransitionKey = '';
let currentMode = 'song';
let currentTransitionKey = '';

// === Background Management ===
// Double-buffered: two absolutely-positioned layers swap so the old
// background stays visible while a new image loads — no flash ever.
const imageCache = new Set();
let bgActive = 'a';
let currentBgKey = '{initial_bg_key}';

function preloadImage(url) {{
    if (!url || imageCache.has(url)) return Promise.resolve();
    return new Promise(resolve => {{
        const img = new Image();
        img.onload = () => {{ imageCache.add(url); resolve(); }};
        img.onerror = () => {{ resolve(); }};
        img.src = url;
    }});
}}

function preloadImages(urls) {{
    if (!urls || !Array.isArray(urls)) return;
    urls.forEach(url => {{ if (url && !imageCache.has(url)) preloadImage(url); }});
}}

const videoPreloadCache = new Map();
const VIDEO_PRELOAD_CAP = 5;
function preloadVideos(urls) {{
    if (IS_PREVIEW || !urls || !Array.isArray(urls)) return;
    urls.forEach(url => {{
        if (!url || videoPreloadCache.has(url)) return;
        // Evict oldest preloads so a long service cannot accumulate live <video>
        // elements (and their decoded buffers) without bound.
        while (videoPreloadCache.size >= VIDEO_PRELOAD_CAP) {{
            const oldest = videoPreloadCache.keys().next().value;
            const oldEl = videoPreloadCache.get(oldest);
            videoPreloadCache.delete(oldest);
            if (oldEl) {{
                try {{
                    oldEl.removeAttribute('src');
                    oldEl.load();
                    oldEl.remove();
                }} catch (_) {{}}
            }}
        }}
        const v = document.createElement('video');
        v.preload = 'auto';
        v.muted = true;
        v.src = url;
        v.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;opacity:0;pointer-events:none;';
        // Seek to frame 0 once data is available so the browser decodes
        // and caches that frame — #video-el can then show it near-instantly.
        v.addEventListener('loadeddata', () => {{ v.currentTime = 0; }}, {{once: true}});
        document.body.appendChild(v);
        videoPreloadCache.set(url, v);
    }});
}}

function switchBackground(bgType, bgColor, bgImage) {{
    // Build a key that uniquely identifies this background state.
    // Colors and image URLs are validated before touching CSS — never concatenate
    // untrusted values into url('...') (quote breakout / CSS injection).
    let key, bgCss, imgCss;
    const hexOk = (c) => typeof c === 'string' &&
        /^#(?:[0-9a-fA-F]{{3}}|[0-9a-fA-F]{{6}}|[0-9a-fA-F]{{8}})$/.test(c.trim());
    const safeStaticUrl = (u) => {{
        if (typeof u !== 'string') return null;
        const s = u.trim();
        if (!/^\/static\/[A-Za-z0-9._~\/-]+$/.test(s)) return null;
        if (s.includes('/../') || s.endsWith('/..')) return null;
        return s;
    }};
    if (bgType === 'image' && bgImage) {{
        const safeUrl = safeStaticUrl(bgImage);
        if (!safeUrl) {{
            key = 't';
            bgCss = 'transparent';
            imgCss = 'none';
        }} else {{
            key = 'i:' + safeUrl;
            bgCss = 'transparent';
            // JSON.stringify produces a double-quoted CSS string literal.
            imgCss = 'url(' + JSON.stringify(safeUrl) + ')';
        }}
    }} else if (bgType === 'color') {{
        const color = hexOk(bgColor) ? bgColor.trim() : '#000000';
        key = 'c:' + color;
        bgCss = color;
        imgCss = 'none';
    }} else {{
        key = 't';
        bgCss = 'transparent';
        imgCss = 'none';
    }}
    if (key === currentBgKey) return;

    const nextId = bgActive === 'a' ? 'b' : 'a';
    const nextEl = document.getElementById('bg-' + nextId);
    const currEl = document.getElementById('bg-' + bgActive);

    const doSwap = () => {{
        nextEl.style.backgroundColor = bgCss;
        nextEl.style.backgroundImage = imgCss;
        nextEl.style.zIndex = '1';
        currEl.style.zIndex = '0';
        if (bgType !== 'image') {{
            currEl.style.backgroundColor = 'transparent';
            currEl.style.backgroundImage = 'none';
        }}
        bgActive = nextId;
        currentBgKey = key;
        // Sync page background for areas outside the fixed-size canvas
        [document.body, document.documentElement].forEach(el => {{
            el.style.backgroundColor = bgCss;
            el.style.backgroundImage = imgCss;
            el.style.backgroundSize = 'cover';
            el.style.backgroundPosition = 'center';
            el.style.backgroundRepeat = 'no-repeat';
        }});
    }};

    // For uncached images, the current layer stays visible while the
    // new image loads into the hidden layer — zero flash guaranteed.
    if (bgType === 'image' && bgImage && !imageCache.has(bgImage)) {{
        preloadImage(bgImage).then(doSwap);
    }} else {{
        doSwap();
    }}
}}

// === Animated background controller (HTML5/CSS lower-third bar, etc.) ===
// Modular presets: each entry supplies the DOM its look needs; the shared CSS
// (.anim-bar + .preset-<id>) and the `.bar-shown` canvas class do the animating.
// To add a preset: register it here and add a matching `.preset-<id>` CSS block
// (and mirror {{id,name}} in admin.js's ANIM_BG_PRESETS so it appears in settings).
const ANIM_BG_PRESETS = {{
    song_bar: {{ name: 'Song Bar', html: '<div class="anim-bar preset-song_bar"></div>' }},
    floating_bar: {{ name: 'Floating Bar', html: '<div class="anim-bar preset-floating_bar"></div>' }},
}};
let ANIM_ACTIVE = false;        // an animated bg is the current effective background
let animPresetMounted = '';     // which preset's DOM is currently in #anim-bg
let _surfaceAnim = null;        // the running Web Animations fade+rise on the text box

// Hex shade helper so presets get a gradient without depending on color-mix.
// amt > 0 lightens toward white, < 0 darkens toward black; |amt| in 0..1.
function _shadeHex(hex, amt) {{
    const m = /^#?([0-9a-f]{{6}})$/i.exec(String(hex || '').trim());
    if (!m) return hex || '#1d2d3c';
    const n = parseInt(m[1], 16);
    const t = amt < 0 ? 0 : 255, k = Math.abs(amt);
    const mix = (c) => Math.max(0, Math.min(255, Math.round(c + (t - c) * k)));
    const r = mix((n >> 16) & 255), g = mix((n >> 8) & 255), b = mix(n & 255);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}}

// "#rrggbb" -> "r,g,b" for use inside rgba() (the floating-bar tint overlay).
function _hexToRgb(hex) {{
    const m = /^#?([0-9a-f]{{6}})$/i.exec(String(hex || '').trim());
    if (!m) return '29,45,60';
    const n = parseInt(m[1], 16);
    return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
}}

function mountAnimBar(preset, s) {{
    const layer = document.getElementById('anim-bg');
    if (!layer) return;
    const def = ANIM_BG_PRESETS[preset] || ANIM_BG_PRESETS.song_bar;
    if (animPresetMounted !== preset) {{
        layer.innerHTML = def.html;
        animPresetMounted = preset;
    }}
    const canvas = document.getElementById('canvas');

    if (s.background_anim_duration !== undefined)
        canvas.style.setProperty('--bar-dur', String(parseInt(s.background_anim_duration)) + 'ms');
    if (s.background_anim_gap !== undefined)
        canvas.style.setProperty('--bar-gap', String(parseInt(s.background_anim_gap)) + 'px');
    if (s.background_anim_inset !== undefined)

// Apply (or tear down) the animated background from a style packet. Acts only when
// background_type is present, so partial style updates never disturb the bar.
function applyAnimBg(s) {{
    if (!s || s.background_type === undefined) return ANIM_ACTIVE;
    const canvas = document.getElementById('canvas');
    const box = document.querySelector('.box'), bibleBox = document.querySelector('.bible-box');
    if (s.background_type === 'animated') {{
        mountAnimBar(s.background_anim_preset || 'song_bar', s);
        if (!ANIM_ACTIVE) {{
            // Entering anim mode: hand the box opacity to the CSS `.bar-shown` rules
            // (the appear/disappear fade) by clearing any inline opacity the normal
            // render path left behind, so the stylesheet's shown target takes over.
            if (box) box.style.opacity = '';
            if (bibleBox) bibleBox.style.opacity = '';
        }}
        ANIM_ACTIVE = true;
        canvas.classList.add('anim-bg-mode');
    }} else if (ANIM_ACTIVE) {{
        // Tear down: drop the classes, empty the layer, and restore the inline box
        // opacity (the shown target we'd been feeding the CSS) so the normal render
        // path again shows text at the configured opacity.
        ANIM_ACTIVE = false;
        canvas.classList.remove('anim-bg-mode', 'bar-shown');
        const layer = document.getElementById('anim-bg');
        if (layer) layer.innerHTML = '';
        animPresetMounted = '';
        if (_surfaceAnim) {{ _surfaceAnim.cancel(); _surfaceAnim = null; }}
        if (box) box.style.opacity = canvas.style.getPropertyValue('--text-opacity') || '';
        if (bibleBox) bibleBox.style.opacity = canvas.style.getPropertyValue('--bible-text-opacity') || '';

}}

// Run the appear (show=true) or disappear rise on the active text surface — a transient
// played only when the BAR's shown state changes. Explicit keyframes are used instead of
// a CSS transition because the surface is often revealed from display:none, where a
// transition wouldn't run. No fill is kept: the resting states are held by CSS
// (`.anim-bg-mode(.bar-shown) .box/.bible-box`) and by the overlay's default-visible
// style, so the keyframes land exactly on the CSS value and hand back cleanly — leaving
// nothing that would fight a within-song overlay fade (applyOverlay).
function animateSurface(show) {{
    const canvas = document.getElementById('canvas');
    const overlayMode = canvas.classList.contains('overlay-mode');
    // In overlay-mode the visible surface is the overlay layer (the .box/.bible-box
    // are hidden), so the rise rides on it.
    const el = overlayMode ? document.getElementById('overlay-layer')
        : (currentMode === 'bible') ? document.querySelector('.bible-box')
        : document.querySelector('.box');
    if (!el || !el.animate) return;
    if (_surfaceAnim) {{ _surfaceAnim.cancel(); _surfaceAnim = null; }}
    const dur = parseInt(canvas.style.getPropertyValue('--bar-dur')) || 600;
    let target = 1;
    if (!overlayMode) {{
        const opVar = (currentMode === 'bible') ? '--bible-text-opacity' : '--text-opacity';
        const shownOp = parseFloat(canvas.style.getPropertyValue(opVar));
        target = isNaN(shownOp) ? 1 : shownOp;
    }}
    const shownFrame = {{ opacity: target, transform: 'translateY(0)' }};
    const hiddenFrame = {{ opacity: 0, transform: 'translateY(22px)' }};
    _surfaceAnim = el.animate(
        show ? [hiddenFrame, shownFrame] : [shownFrame, hiddenFrame],
        {{ duration: dur, easing: 'cubic-bezier(.22,.61,.36,1)' }});
}}

// Drive the bar's in/out state. `.bar-shown` animates the bar itself (CSS, on its own
// always-rendered layer); the text box's matching fade+rise is run via animateSurface
// (WAAPI) so it works even when the box is revealed from display:none. Both are keyed
// off the same shown state and the same duration, so they move together. Line-to-line
// cross-fades stay owned by the inner #text/#text-alt buffers in updateSlide.
function updateAnimPresentation() {{
    if (!ANIM_ACTIVE) return;
    const canvas = document.getElementById('canvas');
    const overlayMode = canvas.classList.contains('overlay-mode');
    // The bar backs the lyric/Bible text surface. Service songs and announcements
    // broadcast mode 'service' (only bible/video/image items get promoted), so
    // 'service' counts as a text mode too. A full-canvas overlay (announcement or
    // song title slide) is a transparent surface sitting over the bar — its own
    // background — so it backs the bar as well rather than suppressing it.
    const textMode = currentMode === 'song' || currentMode === 'bible'
                     || currentMode === 'service' || overlayMode;
    // In Bible mode the bar backs the verse text, so suppress it when this output has
    // Bible text turned off — otherwise it would float over a hidden text box. An
    // overlay carries its own content, so that gate doesn't apply there.
    const surfaceEnabled = (currentMode === 'bible' && !overlayMode) ? SHOW_BIBLE_TEXT : true;
    // Content is present if EITHER surface has something — the overlay layer (which
    // keeps its innerHTML through a fade-out) OR the #text buffer. Using OR keeps the
    // bar's shown state stable across a title-overlay ↔ lyric swap: a title slide's own
    // `html` is '' (so lastSlideHtml reads empty mid-swap, before updateSlide sets the
    // lyric) — without this the bar would flicker and spuriously re-run the rise on the
    // box. Announcements likewise carry their content only in the overlay layer.
    const overlayLayer = document.getElementById('overlay-layer');
    const hasContent = (overlayLayer && overlayLayer.innerHTML.trim() !== '') || lastSlideHtml !== '';
    const shouldShow = textMode && surfaceEnabled && !IS_BLANK && hasContent;
    const wasShown = canvas.classList.contains('bar-shown');
    canvas.classList.toggle('bar-shown', shouldShow);
    // The rise plays ONLY when the bar's shown state changes (hidden↔shown) — the bar
    // and its whole text surface entering or leaving together. While the bar stays up,
    // moving between slides (title overlay ↔ lyric box, line to line) is NOT a rise:
    // the box's shown state is CSS-held via `.bar-shown`, the overlay is default-visible,
    // and the actual content transition is owned by the text theme (the #text buffers'
    // cross-fade, and applyOverlay's fade for the title slide).
    if (shouldShow !== wasShown) animateSurface(shouldShow);
}}

function applyFontCss(css) {{

        if (s.bible_ref_font_bold !== undefined) bibleRef.style.fontWeight = s.bible_ref_font_bold ? 'bold' : 'normal';

    if (imageEl) {{
        const canvas = document.getElementById('canvas');

// Uniformly scale the fixed-resolution stage to fit the current viewport,
// preserving aspect ratio (letterbox/pillarbox on mismatch). Driven by the CSS
// var --fit-scale on #canvas. Recomputed on resize and whenever the design
// resolution changes. offsetWidth/Height are the unscaled layout size, so the
// ratio is correct regardless of the current transform. The browser renders the
// scaled content at the display's native pixel density, so output stays crisp
// even when scaled up onto a 4K panel (or down onto a smaller one).
function fitCanvas() {{
    const canvas = document.getElementById('canvas');
    if (!canvas) return;
    // offsetWidth/Height are the unscaled layout size; clientWidth/Height of the
    // root is the true viewport, so the ratio is correct regardless of the
    // current transform or any device-pixel scaling on the display.
    const cw = canvas.offsetWidth, ch = canvas.offsetHeight;
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    if (!cw || !ch || !vw || !vh) return;
    const scale = Math.min(vw / cw, vh / ch);
    canvas.style.setProperty('--fit-scale', scale > 0 ? String(scale) : '1');

window.addEventListener('resize', fitCanvas);
// Going fullscreen or moving to another monitor doesn't always emit a timely
// 'resize' event; observe the viewport box so the fit also recomputes then.
if (window.ResizeObserver) {{
    new ResizeObserver(fitCanvas).observe(document.documentElement);
}}

// Initial load check (if page loaded with content)
const initialContent = document.getElementById('text').innerHTML;
if (initialContent) lastSlideHtml = initialContent;

let ws;
function connect() {{
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    // Drop handlers on any prior socket before closing so its onclose cannot
    // schedule a second reconnect while we are already opening a new one.
    if (ws) {{
        ws.onclose = null;
        ws.onerror = null;
        ws.onmessage = null;
        try {{ ws.close(); }} catch (_) {{}}
    }}
    ws = new WebSocket(protocol + '//' + window.location.host + '/ws?client_type=output&output_name={output_name}');

    ws.onmessage = (event) => {{
        let data;
        try {{ data = JSON.parse(event.data); }}
        catch (e) {{ console.error('WS parse error', e); return; }}
        applyPacket(data);
    }};

    ws.onclose = () => {{
        setTimeout(connect, 1000);
    }};

    ws.onerror = (err) => {{
        console.error('WS error', err);
        try {{ ws.close(); }} catch (_) {{}}
    }};
}}

// Apply one render packet — the live WebSocket payload, or an export frame fed by the
// image-export harness. Transport-agnostic, so the live path and the export path share
// one render entry point that can't drift apart.
function applyPacket(data) {{
        try {{

            if (data.preload_images !== undefined) {{
                preloadImages(data.preload_images);
            }}
            if (data.preload_videos !== undefined) {{
                preloadVideos(data.preload_videos);
            }}
            if (data.font_css !== undefined) {{
                applyFontCss(data.font_css);
            }}
            if (data.preview_video_mode !== undefined) {{
                previewVideoMode = data.preview_video_mode;
            }}

            // Hold frame: while server is buffering video, keep current display visible.
            // Silently load the video into the element so it's ready to go instantly.
            if (data.hold_frame !== undefined) {{
                holdFrame = data.hold_frame;
            }}
            if (holdFrame) {{
                if (VIDEO_ENABLED && data.video_url) {{
                    const v = document.getElementById('video-el');
                    const effectiveLive = !IS_PREVIEW || previewVideoMode === 'live';
                    const effectiveStill = IS_PREVIEW && previewVideoMode === 'still';
                    if ((effectiveLive || effectiveStill) && v.dataset.src !== data.video_url) {{
                        v.src = data.video_url;
                        v.dataset.src = data.video_url;
                        v.loop = !!data.video_loop;
                        v.load();
                    }}
                }}
                return;
            }}

            // Normal display updates (only reached when hold_frame is false)

            // Mode must be set before style so Bible bg override resolves correctly
            if (data.mode !== undefined) {{
                const effectiveMode = (!VIDEO_ENABLED && data.mode === 'video') ? currentMode : data.mode;
                setMode(effectiveMode);
                // Pause audio whenever leaving video mode
                if (effectiveMode !== 'video') {{
                    const v = document.getElementById('video-el');
                    if (v && !v.paused) v.pause();
                }}

            // Applied before applyStyle so the animated-bar controller sees overlay-mode

            // full and nav packets, so the class never goes stale.
            if (data.overlay_html !== undefined) {{

                // theme's values (this runs before applyStyle updates the globals); nav

                const fadeOn = (data.style && data.style.enable_fade !== undefined)

                // already up) and the non-animated case keep the fade.
                const pendingAnim = (data.style && data.style.background_type !== undefined)
                    ? (String(data.style.background_type) === 'animated') : ANIM_ACTIVE;
                const barRising = pendingAnim && !document.getElementById('canvas').classList.contains('bar-shown');
                applyOverlay(data.overlay_html, data.is_blank, fadeOn && !barRising, fadeDur);
            }}

            if (data.transition_key !== undefined) {{
                currentTransitionKey = data.transition_key;
            }}

            if (data.style !== undefined) {{
                applyStyle(data.style);
            }}

            // Track blank state so the client-side wall clock hides/shows in step with
            // the (server-cleared) slide content. Present on full and nav packets.
            if (data.is_blank !== undefined) {{
                IS_BLANK = !!data.is_blank;
                updateClock();
                // Keep the bar/text in step with blank changes even on packets that
                // don't restate html (updateSlide handles the ones that do).
                updateAnimPresentation();
            }}

            if (data.html !== undefined) {{
                updateSlide(data.html);
            }}

            if (data.bible_ref !== undefined) {{
                document.getElementById('bible-ref').textContent = data.bible_ref;
            }}

            if (data.copyright_info !== undefined) {{
                document.getElementById('copyright-box').textContent = data.copyright_info;
            }}

            if (data.indicator !== undefined) {{
                document.getElementById('indicator').innerHTML = data.indicator;
            }}

            // Video state update — sync position and play/pause
            if (VIDEO_ENABLED && data.video_url !== undefined) {{
                const v = document.getElementById('video-el');
                const effectiveLive = !IS_PREVIEW || previewVideoMode === 'live';
                const effectiveStill = IS_PREVIEW && previewVideoMode === 'still';
                if (!effectiveLive && !effectiveStill) {{
                    // preview_video_mode === 'disabled': do nothing
                }} else if (data.video_url === null) {{
                    v.pause();
                }} else {{
                    const targetPos = data.video_position || 0;
                    const shouldPlay = !!data.video_autoplay;
                    const isNew = v.dataset.src !== data.video_url;
                    if (isNew) {{
                        v.src = data.video_url;
                        v.dataset.src = data.video_url;
                        v.loop = !!data.video_loop;
                    }}
                    if (effectiveStill) {{
                        const showStill = () => {{
                            v.currentTime = targetPos;
                            v.pause();
                        }};
                        if (v.readyState >= 1) {{ showStill(); }}
                        else {{ v.addEventListener('loadedmetadata', function _h() {{ v.removeEventListener('loadedmetadata', _h); showStill(); }}); }}
                    }} else {{
                        const syncAndPlay = () => {{
                            if (isNew || Math.abs(v.currentTime - targetPos) > 3) {{ v.currentTime = targetPos; }}
                            if (shouldPlay) {{ v.play().catch(() => {{}}); }} else {{ v.pause(); }}
                        }};
                        if (v.readyState >= 1) {{ syncAndPlay(); }}
                        else {{ v.addEventListener('loadedmetadata', function _h() {{ v.removeEventListener('loadedmetadata', _h); syncAndPlay(); }}); }}
                    }}
                }}
            }}

            // Real-time video commands (play/pause/restart/seek)
            if (VIDEO_ENABLED && (!IS_PREVIEW || previewVideoMode === 'live') && data.video_command !== undefined) {{
                const v = document.getElementById('video-el');
                if (data.video_command === 'play') v.play().catch(() => {{}});
                else if (data.video_command === 'pause') v.pause();
                else if (data.video_command === 'restart') {{ v.currentTime = 0; v.play().catch(() => {{}}); }}
                else if (data.video_command === 'seek' && data.video_position !== undefined) {{ v.currentTime = data.video_position; }}
            }}

            // Image state update
            if (IMAGE_ENABLED && data.image_url !== undefined) {{
                const imgEl = document.getElementById('image-el');
                if (data.image_url === null) {{
                    imgEl.removeAttribute('src');
                }} else if (imgEl.src !== data.image_url) {{
                    imgEl.src = data.image_url;
                }}
            }}
        }} catch (e) {{
            console.error('applyPacket error', e);
        }}
}}

let countdownInterval = null;

function formatCountdown(remaining) {{
    const neg = remaining < 0;
    const abs = Math.abs(Math.ceil(remaining));
    const m = Math.floor(abs / 60);
    const s = abs % 60;
    return (neg ? '-' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}}

function updateCountdown() {{
    const v = document.getElementById('video-el');
    const el = document.getElementById('video-countdown');
    if (!v || !el) return;
    if (isNaN(v.duration) || v.duration === Infinity) {{
        el.textContent = '';
        return;
    }}
    el.textContent = formatCountdown(v.currentTime - v.duration);
}}

// === Wall clock ===
function formatClock(d) {{
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, '0');
    let suffix = '';
    if (!CLOCK_24H) {{
        suffix = h >= 12 ? ' PM' : ' AM';
        h = h % 12;
        if (h === 0) h = 12;
    }}
    const hh = CLOCK_24H ? String(h).padStart(2, '0') : String(h);
    let t = hh + ':' + m;
    if (CLOCK_SECONDS) t += ':' + String(d.getSeconds()).padStart(2, '0');
    return t + suffix;
}}

// Refresh the clock's text and visibility. Visible only when enabled and the output
// isn't blanked — so blanking hides it like the (server-cleared) slide content.
function updateClock() {{
    const el = document.getElementById('clock');
    if (!el) return;
    const visible = CLOCK_ON && !IS_BLANK;
    el.style.opacity = visible ? 1 : 0;
    if (visible) el.textContent = formatClock(new Date());
}}

function setMode(mode) {{
    const wasVideo = currentMode === 'video';
    currentMode = mode;
    const canvas = document.getElementById('canvas');
    // Reset to the mode class, but preserve the animated-bg classes — they're owned by
    // the bar controller, not the content mode. (bar-shown is then re-evaluated by
    // updateAnimPresentation.) This keeps the bar/text fade correct across a mode
    // change regardless of whether a style packet follows.
    const animCls = (ANIM_ACTIVE ? ' anim-bg-mode' : '')
                  + (canvas.classList.contains('bar-shown') ? ' bar-shown' : '');
    canvas.className = 'canvas ' + mode + '-mode' + animCls;
    if (mode === 'video') {{
        if (!IS_PREVIEW && !countdownInterval) {{
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 500);
        }}
    }} else {{
        if (countdownInterval) {{
            clearInterval(countdownInterval);
            countdownInterval = null;
        }}
        document.getElementById('video-countdown').textContent = '';
        // Clear the video element when leaving video mode so the stale last
        // frame never shows during the buffer window of the next video.
        if (wasVideo) {{
            const v = document.getElementById('video-el');
            v.pause();
            v.removeAttribute('src');
            v.load();
            delete v.dataset.src;
        }}
    }}
}}

let _overlayFadeToken = 0;   // guards a pending fade-out cleanup against being superseded

// Show or hide the per-slide overlay (song title slide / announcement). When the text
// theme's fade is in use, the overlay cross-fades via a CSS opacity transition —
// matching the lyric fade, and (on hide) dissolving over the lyric appearing beneath it
// (overlay-layer sits above .box). This applies WITH an animated bar too, for slide-to-
// slide moves while the bar stays up; the caller passes fadeOn=false only when the bar
// is entering this packet, so its rise (animateSurface) owns that one transition. With
// fade off the overlay snaps.
function applyOverlay(html, isBlank, fadeOn, fadeDur) {{
    const canvas = document.getElementById('canvas');
    const layer = document.getElementById('overlay-layer');
    const show = !!(html && !isBlank);
    const fade = fadeOn;
    const token = ++_overlayFadeToken;

    if (show) {{
        layer.style.display = '';          // overlay-mode CSS owns display on show
        layer.innerHTML = html;
        canvas.classList.add('overlay-mode');
        if (fade) {{
            layer.style.transition = 'none';
            layer.style.opacity = '0';
            void layer.offsetWidth;        // commit opacity:0 before transitioning up
            layer.style.transition = 'opacity ' + String(fadeDur) + 'ms ease-in-out';
            layer.style.opacity = '1';
        }} else {{
            // Animated bar (opacity owned by animateSurface) or fade off: no transition.
            layer.style.transition = '';
            layer.style.opacity = '';
        }}
    }} else if (fade && layer.innerHTML !== '') {{
        // Drop overlay-mode so the lyric/.box appears beneath, and fade the overlay out
        // over it, then clear the layer — unless a newer packet supersedes this one.
        canvas.classList.remove('overlay-mode');
        layer.style.display = 'block';
        layer.style.transition = 'opacity ' + String(fadeDur) + 'ms ease-in-out';
        layer.style.opacity = '0';
        setTimeout(() => {{
            if (token === _overlayFadeToken) {{
                layer.innerHTML = '';
                layer.style.display = '';
                layer.style.transition = '';
                layer.style.opacity = '';
            }}
        }}, fadeDur);
    }} else {{
        canvas.classList.remove('overlay-mode');
        layer.innerHTML = '';
        layer.style.display = '';
        layer.style.transition = '';
        layer.style.opacity = '';
    }}
}}

function updateSlide(newSlideHtml) {{
    const isBlank = newSlideHtml === '';
    const effectiveKey = currentTransitionKey || currentMode;
    const modeChanged = effectiveKey !== lastTransitionKey;

    if (newSlideHtml !== lastSlideHtml || modeChanged) {{
      lastSlideHtml = newSlideHtml;
      lastTransitionKey = effectiveKey;

      // Render newSlideHtml into the primary/alt container pair, fading between them
      // when enabled. Returns the new container index. Closes over newSlideHtml,
      // isBlank, modeChanged, ENABLE_FADE and FADE_DURATION.
      const renderSlideInto = (primaryId, altId, containerIndex) => {{
          if (ENABLE_FADE && !modeChanged) {{
            const currentContainer = document.getElementById(containerIndex === 0 ? primaryId : altId);
            const nextContainer = document.getElementById(containerIndex === 0 ? altId : primaryId);
            nextContainer.innerHTML = newSlideHtml;
            currentContainer.style.transition = 'opacity ' + String(FADE_DURATION) + 'ms ease-in-out';
            nextContainer.style.transition = 'opacity ' + String(FADE_DURATION) + 'ms ease-in-out';
            currentContainer.style.opacity = '0';
            nextContainer.style.opacity = isBlank ? '0' : '1';
            return 1 - containerIndex;
          }} else {{
            const p = document.getElementById(primaryId);
            const a = document.getElementById(altId);
            p.style.transition = 'none';
            a.style.transition = 'none';
            p.innerHTML = newSlideHtml;
            a.innerHTML = '';
            p.style.opacity = isBlank ? '0' : '1';
            a.style.opacity = '0';
            return 0;
          }}
      }};

      if (currentMode === 'bible') {{
          bibleContainerIndex = renderSlideInto('bible-text', 'bible-text-alt', bibleContainerIndex);
      }} else {{
          songContainerIndex = renderSlideInto('text', 'text-alt', songContainerIndex);
      }}
    }}
    // Sync the animated bar's in/out to this content change (no-op when inactive).
    updateAnimPresentation();
}}

fitCanvas();

// Mount the animated background from the baked config so the first paint already
// shows the correct bar state, before the first WebSocket packet arrives.
try {{
    const INITIAL_ANIM = {initial_anim_json};
    if (INITIAL_ANIM && INITIAL_ANIM.background_type === 'animated') {{
        applyAnimBg(INITIAL_ANIM);
        updateAnimPresentation();
    }}
}} catch (e) {{ /* non-fatal: the first WS packet will set this up */ }}

if (IS_EXPORT) {{
    setupExportHarness();
}} else {{
    connect();

    // Tick the wall clock once a second (cheap; reads real time each tick so the
    // displayed value never drifts). Visibility is gated inside updateClock().
    updateClock();
    clockInterval = setInterval(updateClock, 1000);
}}

// === Image-export harness ===
// The server loads this page in headless Chromium (_render_export_zip in lyrics.py),
// pushes one render packet per slide, and screenshots the result. We reuse the exact
// live render path (applyPacket), only freezing transitions/animations so each frame
// is captured at its final, settled state instead of mid-fade.
function setupExportHarness() {{
    const st = document.createElement('style');
    st.textContent = '.canvas, .canvas * {{ transition: none !important; animation: none !important; }}';
    document.head.appendChild(st);
    IS_BLANK = false;
    // Apply a frame, then resolve once it is visually settled (fonts + images loaded,
    // layout/paint flushed). The driver awaits this before capturing.
    window.__ssApplyExportFrame = async (pkt) => {{
        applyPacket(pkt);
        await settleForExport(pkt);
        return true;
    }};
    window.__ssExportReady = true;
}}

async function settleForExport(pkt) {{
    try {{ if (document.fonts && document.fonts.ready) await document.fonts.ready; }} catch (e) {{}}
    // CSS background images have no load event, so preload them (and any image-slide
    // source) explicitly before capture.
    const urls = [];
    const s = (pkt && pkt.style) || {{}};
    for (const k of ['background_image', 'bible_background_image']) {{
        if (s[k]) urls.push(String(s[k]));
    }}
    if (pkt && pkt.image_url) urls.push(pkt.image_url);
    if (pkt && Array.isArray(pkt.preload_images)) urls.push(...pkt.preload_images);
    await Promise.all(urls.filter(Boolean).map((u) => new Promise((res) => {{
        const im = new Image();
        im.onload = im.onerror = () => res();
        im.src = u;
    }})));
    // Wait on any <img> the frame actually gave a source (image slides). Crucially,
    // only wait when the element HAS a src and hasn't finished: the always-present
    // #image-el sits in .canvas with no src on song/announcement slides, and a
    // src-less img fires neither load nor error — waiting on it hangs forever (this
    // was the "stops after the first slide" bug).
    const imgs = Array.from(document.querySelectorAll('.canvas img'))
        .filter((im) => im.getAttribute('src') && !im.complete);
    await Promise.all(imgs.map((im) => new Promise((res) => {{
        im.onload = im.onerror = () => res();
    }})));
    // Flush layout+paint. requestAnimationFrame can stall in a non-foreground/headless
    // context (this once hung the capture after the first slide), so race it against a
    // timeout — whichever fires first — and never block on rAF alone.
    await new Promise((res) => {{
        let done = false;
        const finish = () => {{ if (!done) {{ done = true; res(); }} }};
        requestAnimationFrame(() => requestAnimationFrame(finish));
        setTimeout(finish, 150);
    }});
    await new Promise((res) => setTimeout(res, 40));
}}
</script>
